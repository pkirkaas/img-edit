[project]
name = "img-edit"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Paul Kirkaas", email = "pkirkaas@gmail.com"},
]
dependencies = [
    "git+https://github.com/huggingface/diffusers",
    "huggingface_hub>=0.24",
    "httpx>=0.27",
    "pillow>=10.3",
    "numpy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "typer>=0.12.5",
    "rich>=13.7",
    "tqdm>=4.66"
]
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[tool.pdm.dev-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.8",
    "mypy>=1.10",
    "pre-commit>=3.7"
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]

[tool.pdm.scripts]
lint = "ruff check src"
fmt = "black src"
typecheck = "mypy --python-version 3.13 --ignore-missing-imports src"
test = "pytest -q"
img-edit = { cmd = "python -m cli.main", env = { PYTHONPATH = "src" } }
